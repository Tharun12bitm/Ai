<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
            animation: slideIn 1.2s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        #name {
            font-size: 1.5em;
            color: rgba(255, 255, 255, 0.9);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            animation: cardSlideUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .card:nth-child(1) { animation-delay: 0.2s; }
        .card:nth-child(2) { animation-delay: 0.4s; }
        .card:nth-child(3) { animation-delay: 0.6s; }
        .card:nth-child(4) { animation-delay: 0.8s; }

        @keyframes cardSlideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .card h3 {
            color: white;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5em;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-button {
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .card-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
        }

        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 20%;
            right: 10%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 100px;
            height: 100px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        .shape:nth-child(4) {
            width: 40px;
            height: 40px;
            top: 60%;
            right: 20%;
            animation-delay: 1s;
        }

        .shape:nth-child(5) {
            width: 120px;
            height: 120px;
            bottom: 10%;
            right: 5%;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            .dashboard-container {
                padding: 0 10px;
            }

            .welcome-section {
                margin-bottom: 30px;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
                gap: 15px;
                margin-top: 30px;
            }

            h1 {
                font-size: 2.5em;
            }

            .card {
                padding: 20px;
            }

            .card h3 {
                font-size: 1.3em;
            }

            .card p {
                font-size: 0.9em;
            }

            .card-button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .shape {
                display: none; /* Hide floating shapes on mobile for better performance */
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .welcome-section {
                margin-bottom: 20px;
            }

            .dashboard-grid {
                gap: 10px;
                margin-top: 20px;
            }

            h1 {
                font-size: 2em;
            }

            #name {
                font-size: 1.2em;
            }

            .card {
                padding: 15px;
            }

            .card h3 {
                font-size: 1.2em;
                margin-bottom: 10px;
            }

            .card p {
                font-size: 0.85em;
                margin-bottom: 15px;
            }

            .card-button {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        @media (max-width: 320px) {
            body {
                padding: 5px;
            }

            h1 {
                font-size: 1.8em;
            }

            #name {
                font-size: 1.1em;
            }

            .card {
                padding: 12px;
            }

            .card h3 {
                font-size: 1.1em;
            }

            .card p {
                font-size: 0.8em;
            }

            .card-button {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        /* High-resolution displays */
        @media (min-width: 1200px) {
            .dashboard-container {
                max-width: 1400px;
            }

            .dashboard-grid {
                grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
                gap: 25px;
            }

            h1 {
                font-size: 3.5em;
            }

            #name {
                font-size: 1.8em;
            }

            .card {
                padding: 35px;
            }

            .card h3 {
                font-size: 1.6em;
            }

            .card p {
                font-size: 1.1em;
            }

            .card-button {
                padding: 14px 28px;
                font-size: 17px;
            }
        }

        /* Tablet landscape */
        @media (min-width: 769px) and (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .card {
                padding: 25px;
            }
        }

        /* Landscape orientation for mobile */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                padding: 10px;
                overflow-y: auto;
            }

            .welcome-section {
                margin-bottom: 15px;
            }

            .dashboard-grid {
                margin-top: 15px;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 5px;
            }

            .card {
                padding: 15px;
            }
        }

        /* Reduced motion for accessibility */
        @media (prefers-reduced-motion: reduce) {
            .dashboard-container,
            h1,
            #name,
            .card,
            .card-button:hover,
            .shape {
                animation: none;
                transition: none;
            }

            .card:hover {
                transform: none;
            }

            .card-button:hover {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="dashboard-container">
        <div class="welcome-section">
            <h1>Dashboard</h1>
            <h2 id="name"></h2>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <h3>Profile</h3>
                <p>Manage your account settings and personal information.</p>
                <button class="card-button">View Profile</button>
            </div>

            <div class="card">
                <h3>Analytics</h3>
                <p>View detailed analytics and insights about your activity.</p>
                <button class="card-button">View Analytics</button>
            </div>

            <div class="card">
                <h3>Settings</h3>
                <p>Configure your preferences and application settings.</p>
                <button class="card-button">Open Settings</button>
            </div>

            <div class="card">
                <h3>Support</h3>
                <p>Get help and support for any questions or issues.</p>
                <button class="card-button">Contact Support</button>
            </div>
        </div>
    </div>
    <script>
        let user = localStorage.getItem("user");
        document.getElementById("name").innerText = "Welcome " + user;
    </script>
</body>
</html>
